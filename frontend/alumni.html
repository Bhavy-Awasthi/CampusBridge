<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Alumni & Jobs — CampusBridge</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #0a0e1a;
      --surface: rgba(10, 16, 35, 0.75);
      --border: rgba(99, 130, 255, 0.16);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --dim: #475569
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0
    }

    .blob-1 {
      width: 500px;
      height: 500px;
      background: rgba(244, 63, 94, 0.07);
      top: -100px;
      right: -100px
    }

    .page-wrap {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem
    }

    .page-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      padding: 4px;
      width: fit-content
    }

    .page-tab {
      padding: 0.55rem 1.25rem;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s
    }

    .page-tab.active {
      background: #f59e0b;
      color: #fff
    }

    /* Alumni Grid */
    .alumni-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem
    }

    .alumni-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.5rem;
      
      transition: all 0.25s
    }

    .alumni-card:hover {
      transform: translateY(-3px);
      border-color: rgba(168, 85, 247, 0.35);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35)
    }

    .alumni-header {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 0.85rem
    }

    .alumni-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(168, 85, 247, 0.3)
    }

    .alumni-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff
    }

    .alumni-sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.2rem
    }

    .alumni-bio {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 0.85rem;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical
    }

    .alumni-footer {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap
    }

    /* Jobs Grid */
    .jobs-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1.5rem
    }

    @media(max-width:820px) {
      .jobs-layout {
        grid-template-columns: 1fr
      }
    }

    .job-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.35rem;
      margin-bottom: 0.85rem;
      
      transition: all 0.25s
    }

    .job-card:hover {
      transform: translateX(2px);
      border-color: rgba(99, 130, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3)
    }

    .job-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.3rem
    }

    .job-company {
      font-size: 0.85rem;
      color: #14b8a6;
      font-weight: 500;
      margin-bottom: 0.5rem
    }

    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem
    }

    .job-meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.72rem;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(99, 130, 255, 0.1);
      border-radius: 999px;
      padding: 0.2rem 0.65rem
    }

    .job-type {
      display: inline-block;
      padding: 0.18rem 0.6rem;
      border-radius: 999px;
      font-size: 0.67rem;
      font-weight: 700
    }

    .type-full {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #34d399
    }

    .type-intern {
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.2);
      color: #fbbf24
    }

    .type-part {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.2);
      color: #fbbf24
    }

    .type-contract {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.2);
      color: #fb7185
    }

    .job-desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 0.75rem
    }

    .job-footer {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap
    }

    .job-poster {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      color: var(--dim)
    }

    .job-poster-avatar {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      object-fit: cover
    }

    .post-job-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.5rem;
      
    }

    .post-job-form h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 1rem
    }
  </style>
</head>

<body>
  <div class="blob blob-1"></div>
  <script src="js/auth.js"></script>
  <script>renderNav('alumni');</script>

  <div class="page-wrap">
    <div class="page-header">
      <h1>Alumni & Jobs</h1>
      <p>Connect with alumni and explore career opportunities</p>
    </div>

    <div class="page-tabs">
      <button class="page-tab active" onclick="showTab('alumni',this)">Alumni Directory</button>
      <button class="page-tab" onclick="showTab('jobs',this)">Job Board</button>
    </div>

    <!-- Alumni Tab -->
    <div id="tab-alumni">
      <div style="margin-bottom:1rem">
        <input id="alumni-search" class="cb-input" placeholder="Search alumni by name, company..."
          style="max-width:400px" oninput="filterAlumni()" />
      </div>
      <div class="alumni-grid" id="alumni-grid">
        <div style="text-align:center;padding:3rem;grid-column:1/-1"><span class="spinner"></span></div>
      </div>
    </div>

    <!-- Jobs Tab -->
    <div id="tab-jobs" style="display:none">
      <div class="jobs-layout">
        <div>
          <div id="jobs-list">
            <div style="text-align:center;padding:3rem"><span class="spinner"></span></div>
          </div>
        </div>
        <!-- Post job form (Alumni only) -->
        <div id="post-job-wrap" style="display:none">
          <div class="post-job-form">
            <h3>💼 Post a Job</h3>
            <div class="cb-form-group"><label class="cb-label">Job Title</label><input id="j-title" class="cb-input"
                placeholder="e.g. Software Engineer" /></div>
            <div class="cb-form-group"><label class="cb-label">Company</label><input id="j-company" class="cb-input"
                placeholder="e.g. Google" /></div>
            <div class="cb-form-group"><label class="cb-label">Type</label>
              <select id="j-type" class="cb-input cb-select">
                <option>Full-time</option>
                <option>Part-time</option>
                <option>Internship</option>
                <option>Contract</option>
              </select>
            </div>
            <div class="cb-form-group"><label class="cb-label">Location</label><input id="j-location" class="cb-input"
                placeholder="e.g. Bangalore / Remote" /></div>
            <div class="cb-form-group"><label class="cb-label">Description</label><textarea id="j-desc"
                class="cb-input cb-textarea" placeholder="Role description, requirements..."></textarea></div>
            <div class="cb-form-group"><label class="cb-label">Apply Link (URL)</label><input id="j-link"
                class="cb-input" placeholder="https://..." /></div>
            <button class="cb-btn cb-btn-primary" style="width:100%" onclick="postJob()">Post Job</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const myUser = getUser();
    let allAlumni = [];

    if (myUser?.role === 'Alumni') document.getElementById('post-job-wrap').style.display = '';

    function showTab(name, btn) {
      document.querySelectorAll('.page-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-alumni').style.display = name === 'alumni' ? '' : 'none';
      document.getElementById('tab-jobs').style.display = name === 'jobs' ? '' : 'none';
      if (name === 'jobs') loadJobs();
    }

    async function loadAlumni() {
      const res = await apiFetch('/alumni');
      allAlumni = await res.json();
      renderAlumni(allAlumni);
    }

    function filterAlumni() {
      const q = document.getElementById('alumni-search').value.toLowerCase();
      renderAlumni(allAlumni.filter(a => a.fullName.toLowerCase().includes(q) || (a.company || '').toLowerCase().includes(q) || (a.department || '').toLowerCase().includes(q)));
    }

    function renderAlumni(alumni) {
      const grid = document.getElementById('alumni-grid');
      if (!alumni.length) { grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><p>No alumni found.</p></div>'; return; }
      grid.innerHTML = alumni.map(a => `
    <div class="alumni-card">
      <div class="alumni-header">
        <a href="profile.html?id=${a._id}"><img src="${avatarUrl(a.avatar)}" class="alumni-avatar"/></a>
        <div>
          <a href="profile.html?id=${a._id}" style="text-decoration:none"><div class="alumni-name">${a.fullName}</div></a>
          <div class="alumni-sub">🏢 ${a.company || 'Exploring'} ${a.batch ? '· Class of ' + a.batch : ''}</div>
        </div>
      </div>
      ${a.bio ? `<div class="alumni-bio">${a.bio}</div>` : ''}
      ${a.department ? `<div style="font-size:0.74rem;color:var(--dim);margin-bottom:0.6rem">🎓 ${a.department}</div>` : ''}
      <div class="alumni-footer">
        <a href="profile.html?id=${a._id}" class="cb-btn cb-btn-secondary cb-btn-sm">View Profile</a>
        <a href="dm.html?user=${a._id}" class="cb-btn cb-btn-primary cb-btn-sm">Message</a>
      </div>
    </div>`).join('');
    }

    async function loadJobs() {
      const res = await apiFetch('/jobs');
      const jobs = await res.json();
      const el = document.getElementById('jobs-list');
      if (!jobs.length) { el.innerHTML = '<div class="empty-state"><p>No jobs posted yet. Alumni can post opportunities!</p></div>'; return; }
      const typeClass = { 'Full-time': 'type-full', 'Internship': 'type-intern', 'Part-time': 'type-part', 'Contract': 'type-contract' };
      const isOwn = (j) => j.postedBy?._id === myUser?.id || j.postedBy?._id === myUser?._id;
      el.innerHTML = jobs.map(j => `
    <div class="job-card">
      <div class="job-title">${j.title}</div>
      <div class="job-company">${j.company}</div>
      <div class="job-meta">
        <span class="job-type ${typeClass[j.type] || 'type-full'}">${j.type}</span>
        <span class="job-meta-chip">📍 ${j.location}</span>
        <span class="job-meta-chip">⏰ ${timeAgo(j.createdAt)}</span>
      </div>
      ${j.description ? `<div class="job-desc">${j.description}</div>` : ''}
      <div class="job-footer">
        <div class="job-poster">
          <img src="${avatarUrl(j.postedBy?.avatar)}" class="job-poster-avatar"/>
          Posted by <a href="profile.html?id=${j.postedBy?._id}" style="color:inherit;margin-left:2px">${j.postedBy?.fullName}</a>
        </div>
        <div style="margin-left:auto;display:flex;gap:0.5rem">
          ${j.applyLink ? `<a href="${j.applyLink}" target="_blank" class="cb-btn cb-btn-primary cb-btn-sm">Apply Now →</a>` : ''}
          ${isOwn(j) ? `<button class="cb-btn cb-btn-danger cb-btn-sm" onclick="deleteJob('${j._id}',this)">Delete</button>` : ''}
        </div>
      </div>
    </div>`).join('');
    }

    async function postJob() {
      const payload = {
        title: document.getElementById('j-title').value,
        company: document.getElementById('j-company').value,
        type: document.getElementById('j-type').value,
        location: document.getElementById('j-location').value,
        description: document.getElementById('j-desc').value,
        applyLink: document.getElementById('j-link').value,
      };
      if (!payload.title || !payload.company) { alert('Title and company required.'); return; }
      try {
        const res = await apiFetch('/jobs', { method: 'POST', body: JSON.stringify(payload) });
        if (res.ok) {
          ['j-title', 'j-company', 'j-location', 'j-desc', 'j-link'].forEach(id => document.getElementById(id).value = '');
          loadJobs();
        }
      } catch { }
    }

    async function deleteJob(id, btn) {
      if (!confirm('Delete this job posting?')) return;
      try {
        await apiFetch(`/jobs/${id}`, { method: 'DELETE' });
        btn.closest('.job-card').remove();
      } catch { }
    }

    loadAlumni();
  </script>
</body>

</html>
