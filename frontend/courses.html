<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Courses — CampusBridge</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0e1a;--surface:rgba(12,17,30,0.8);--border:rgba(245,158,11,0.12);--text:#f1f5f9;--muted:#a1a1aa;--dim:#57534e}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(245,158,11,0.3);border-radius:3px}
    .blob{position:fixed;pointer-events:none;z-index:0}
    .blob-1{width:600px;height:600px;background:radial-gradient(circle, rgba(20,184,166,0.1) 0%, transparent 70%);top:-200px;right:-200px}
    .page-wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:1.5rem}

    .courses-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.25rem;margin-top:1.5rem}
    .course-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1.5rem;cursor:pointer;transition:all 0.25s}
    .course-card:hover{transform:translateY(-3px);border-color:rgba(245,158,11,0.3);box-shadow:0 16px 40px rgba(0,0,0,0.35)}
    .course-subject{display:inline-block;padding:0.2rem 0.75rem;border-radius:999px;font-size:0.7rem;font-weight:600;background:radial-gradient(circle, rgba(20,184,166,0.15) 0%, transparent 70%);border:1px solid rgba(20,184,166,0.15);color:#14b8a6;margin-bottom:0.75rem}
    .course-title{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:700;color:#fff;margin-bottom:0.4rem}
    .course-desc{font-size:0.82rem;color:var(--muted);line-height:1.5;margin-bottom:0.75rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    .course-footer{display:flex;align-items:center;gap:0.75rem;margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid rgba(245,158,11,0.06)}
    .course-prof{display:flex;align-items:center;gap:0.5rem;font-size:0.78rem;color:var(--muted);flex:1}
    .course-prof-avatar{width:22px;height:22px;border-radius:50%;object-fit:cover}
    .enrolled-count{font-size:0.75rem;color:var(--dim)}

    /* Modal Detail */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:2000;display:flex;align-items:center;justify-content:center;padding:1rem;overflow-y:auto}
    .modal{background:rgba(12,17,30,0.98);border:1px solid rgba(245,158,11,0.18);border-radius:24px;padding:2rem;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;}
    .modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem}
    .modal-title{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:800;color:#fff}
    .modal-close{background:none;border:none;color:var(--muted);cursor:pointer;padding:0.25rem;border-radius:6px;transition:color 0.2s;flex-shrink:0}
    .modal-close:hover{color:#fff}
    .detail-tabs{display:flex;gap:0.5rem;margin-bottom:1.5rem;background:rgba(15,20,35,0.8);border-radius:10px;padding:4px}
    .detail-tab{flex:1;padding:0.5rem;border-radius:7px;border:none;background:transparent;color:var(--muted);font-family:'Inter',sans-serif;font-size:0.82rem;font-weight:500;cursor:pointer;transition:all 0.2s;text-align:center}
    .detail-tab.active{background:#f59e0b;color:#fff}
    .tab-panel{display:none}.tab-panel.active{display:block}
    .resource-item,.assignment-item{background:rgba(15,20,35,0.8);border:1px solid rgba(245,158,11,0.08);border-radius:10px;padding:0.75rem 1rem;margin-bottom:0.6rem;display:flex;align-items:center;gap:0.75rem}
    .resource-link{color:#14b8a6;text-decoration:none;font-size:0.85rem;font-weight:500}
    .resource-link:hover{text-decoration:underline}
    .assignment-due{font-size:0.72rem;color:var(--dim);margin-top:0.2rem}
  </style>
</head>
<body>
<div class="blob blob-1"></div>
<script src="js/auth.js"></script>
<script>renderNav('courses');</script>

<div class="page-wrap">
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem">
    <div class="page-header" style="margin-bottom:0"><h1>Courses</h1><p>Browse, enroll, and manage your courses</p></div>
    <div id="prof-actions" style="display:none">
      <button class="cb-btn cb-btn-primary" onclick="openCreateModal()">+ Create Course</button>
    </div>
  </div>

  <div class="courses-grid" id="courses-grid">
    <div style="text-align:center;padding:3rem;grid-column:1/-1"><span class="spinner"></span></div>
  </div>
</div>

<!-- Course Detail Modal -->
<div class="modal-overlay" id="detail-modal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div id="dm-subject" class="course-subject"></div>
        <div class="modal-title" id="dm-title"></div>
        <div id="dm-desc" style="font-size:0.85rem;color:var(--muted);margin-top:0.4rem"></div>
      </div>
      <button class="modal-close" onclick="document.getElementById('detail-modal').style.display='none'">✕</button>
    </div>
    <div id="dm-enroll-section" style="margin-bottom:1rem"></div>
    <div class="detail-tabs">
      <button class="detail-tab active" onclick="switchTab('resources',this)">Resources</button>
      <button class="detail-tab" onclick="switchTab('assignments',this)">Assignments</button>
      <button class="detail-tab" onclick="switchTab('students',this)">Students</button>
    </div>
    <div id="tab-resources" class="tab-panel active"></div>
    <div id="tab-assignments" class="tab-panel"></div>
    <div id="tab-students" class="tab-panel"></div>
    <div id="prof-add-section"></div>
  </div>
</div>

<!-- Create Course Modal -->
<div class="modal-overlay" id="create-modal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <div class="modal-header"><span class="modal-title">Create Course</span><button class="modal-close" onclick="document.getElementById('create-modal').style.display='none'">✕</button></div>
    <div class="cb-form-group"><label class="cb-label">Course Title</label><input id="cc-title" class="cb-input" placeholder="e.g. Advanced Machine Learning"/></div>
    <div class="cb-form-group"><label class="cb-label">Subject</label><input id="cc-subject" class="cb-input" placeholder="e.g. Machine Learning"/></div>
    <div class="cb-form-group"><label class="cb-label">Description</label><textarea id="cc-desc" class="cb-input cb-textarea" placeholder="Brief course description..."></textarea></div>
    <div style="display:flex;gap:0.75rem;justify-content:flex-end"><button class="cb-btn cb-btn-secondary" onclick="document.getElementById('create-modal').style.display='none'">Cancel</button><button class="cb-btn cb-btn-primary" onclick="createCourse()">Create</button></div>
  </div>
</div>

<script>
const myUser = getUser();
let currentCourse = null;

if (myUser?.role === 'Professor') document.getElementById('prof-actions').style.display = '';

async function loadCourses() {
  const res = await apiFetch('/courses');
  const courses = await res.json();
  const grid = document.getElementById('courses-grid');
  if (!courses.length) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><p>No courses yet. Professors can create courses.</p></div>';
    return;
  }
  grid.innerHTML = courses.map(c => {
    const enrolled = c.enrolledStudents?.some(s => (s._id||s) === myUser?.id);
    return `<div class="course-card" onclick="openDetail('${c._id}')">
      <span class="course-subject">${c.subject}</span>
      <div class="course-title">${c.title}</div>
      <div class="course-desc">${c.description||'No description provided.'}</div>
      <div class="course-footer">
        <div class="course-prof">
          <img src="${avatarUrl(c.professor?.avatar)}" class="course-prof-avatar"/>
          ${c.professor?.fullName}
        </div>
        <span class="enrolled-count">👥 ${c.enrolledStudents?.length||0} enrolled</span>
        ${enrolled ? '<span style="color:#34d399;font-size:0.75rem;font-weight:600">✓ Enrolled</span>' : ''}
      </div>
    </div>`;
  }).join('');
}

async function openDetail(courseId) {
  document.getElementById('detail-modal').style.display = '';
  const res = await apiFetch(`/courses/${courseId}`);
  currentCourse = await res.json();
  const c = currentCourse;
  document.getElementById('dm-subject').textContent = c.subject;
  document.getElementById('dm-title').textContent = c.title;
  document.getElementById('dm-desc').textContent = c.description || '';
  const isEnrolled = c.enrolledStudents?.some(s => (s._id||s) === myUser?.id || s._id === myUser?._id);
  const isProf = c.professor?._id === myUser?.id || c.professor?._id === myUser?._id;
  const enrollSec = document.getElementById('dm-enroll-section');
  if (myUser?.role === 'Student') {
    enrollSec.innerHTML = isEnrolled
      ? `<button class="cb-btn cb-btn-danger cb-btn-sm" onclick="unenroll('${c._id}')">Unenroll</button> <span style="color:#34d399;font-size:0.82rem">✓ You are enrolled</span>`
      : `<button class="cb-btn cb-btn-primary" onclick="enroll('${c._id}')">Enroll in this Course</button>`;
  } else if (isProf) {
    enrollSec.innerHTML = `<button class="cb-btn cb-btn-danger cb-btn-sm" onclick="deleteCourse('${c._id}')">🗑 Delete Course</button>`;
  } else {
    enrollSec.innerHTML = '';
  }

  renderResources(c.resources||[]);
  renderAssignments(c.assignments||[]);
  renderStudents(c.enrolledStudents||[]);

  const profAdd = document.getElementById('prof-add-section');
  if (isProf) {
    profAdd.innerHTML = `
      <div style="margin-top:1.5rem;border-top:1px solid rgba(245,158,11,0.08);padding-top:1.25rem">
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;color:#fff;margin-bottom:1rem">Professor Tools</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
          <div>
            <div class="cb-label" style="margin-bottom:0.5rem">Add Resource</div>
            <input id="res-title" class="cb-input" placeholder="Title" style="margin-bottom:0.5rem"/>
            <input id="res-url" class="cb-input" placeholder="URL (https://...)" style="margin-bottom:0.5rem"/>
            <button class="cb-btn cb-btn-primary cb-btn-sm" onclick="addResource('${c._id}')">Add Resource</button>
          </div>
          <div>
            <div class="cb-label" style="margin-bottom:0.5rem">Add Assignment</div>
            <input id="asgn-title" class="cb-input" placeholder="Title" style="margin-bottom:0.5rem"/>
            <input id="asgn-due" class="cb-input" type="date" style="margin-bottom:0.5rem"/>
            <button class="cb-btn cb-btn-primary cb-btn-sm" onclick="addAssignment('${c._id}')">Add Assignment</button>
          </div>
        </div>
      </div>`;
  } else profAdd.innerHTML = '';
}

function renderResources(resources) {
  document.getElementById('tab-resources').innerHTML = resources.length
    ? resources.map(r => `<div class="resource-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><a href="${r.url}" target="_blank" class="resource-link">${r.title}</a></div>`).join('')
    : '<p style="color:var(--dim);font-size:0.85rem">No resources yet.</p>';
}
function renderAssignments(assignments) {
  document.getElementById('tab-assignments').innerHTML = assignments.length
    ? assignments.map(a => `<div class="assignment-item"><div><div style="font-size:0.88rem;font-weight:600;color:#fff">${a.title}</div>${a.dueDate?`<div class="assignment-due">Due: ${new Date(a.dueDate).toLocaleDateString()}</div>`:''}${a.description?`<div style="font-size:0.78rem;color:var(--muted);margin-top:0.2rem">${a.description}</div>`:''}</div></div>`).join('')
    : '<p style="color:var(--dim);font-size:0.85rem">No assignments yet.</p>';
}
function renderStudents(students) {
  document.getElementById('tab-students').innerHTML = students.length
    ? students.map(s => `<div style="display:flex;align-items:center;gap:0.65rem;padding:0.5rem 0;border-bottom:1px solid rgba(245,158,11,0.05)"><img src="${avatarUrl(s.avatar)}" style="width:30px;height:30px;border-radius:50%;object-fit:cover"/><a href="profile.html?id=${s._id}" style="color:#fff;font-size:0.85rem;font-weight:600;text-decoration:none">${s.fullName}</a></div>`).join('')
    : '<p style="color:var(--dim);font-size:0.85rem">No students enrolled yet.</p>';
}

function switchTab(name, btn) {
  document.querySelectorAll('.detail-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

async function enroll(id) {
  const res = await apiFetch(`/courses/${id}/enroll`,{method:'POST'});
  const d = await res.json();
  alert(d.message);
  openDetail(id);loadCourses();
}
async function unenroll(id) {
  const res = await apiFetch(`/courses/${id}/enroll`,{method:'DELETE'});
  const d = await res.json();
  openDetail(id);loadCourses();
}
async function createCourse() {
  const body={title:document.getElementById('cc-title').value,subject:document.getElementById('cc-subject').value,description:document.getElementById('cc-desc').value};
  if(!body.title||!body.subject){alert('Title and subject required');return;}
  await apiFetch('/courses',{method:'POST',body:JSON.stringify(body)});
  document.getElementById('create-modal').style.display='none';
  document.getElementById('cc-title').value='';document.getElementById('cc-subject').value='';document.getElementById('cc-desc').value='';
  loadCourses();
}
async function deleteCourse(id) {
  if(!confirm('Are you sure you want to permanently delete this course?')) return;
  try {
    const res = await apiFetch(`/courses/${id}`, {method: 'DELETE'});
    if (!res.ok) {
      let msg = 'Unknown error';
      try { const data = await res.json(); msg = data.message || msg; } catch(e) { msg = `Server returned status ${res.status}`; }
      alert('Failed to delete course: ' + msg + '\n\nDid you restart the backend server?');
      return;
    }
    document.getElementById('detail-modal').style.display='none';
    loadCourses();
  } catch (err) {
    alert('Network error: ' + err.message);
  }
}
async function addResource(courseId) {
  const title=document.getElementById('res-title').value;const url=document.getElementById('res-url').value;
  if(!title||!url)return;
  const res=await apiFetch(`/courses/${courseId}/resource`,{method:'POST',body:JSON.stringify({title,url})});
  const c=await res.json();renderResources(c.resources||[]);
  document.getElementById('res-title').value='';document.getElementById('res-url').value='';
}
async function addAssignment(courseId) {
  const title=document.getElementById('asgn-title').value;const dueDate=document.getElementById('asgn-due').value;
  if(!title)return;
  const res=await apiFetch(`/courses/${courseId}/assignment`,{method:'POST',body:JSON.stringify({title,dueDate})});
  const c=await res.json();renderAssignments(c.assignments||[]);
  document.getElementById('asgn-title').value='';document.getElementById('asgn-due').value='';
}
function openCreateModal(){document.getElementById('create-modal').style.display='';}

loadCourses();
</script>
</body>
</html>
