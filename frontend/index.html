<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusBridge — Login</title>
  <meta name="description" content="Sign in to CampusBridge — the intelligent platform bridging every campus connection."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --clr-bg:       #0a0e1a;
      --clr-surface:  rgba(12, 17, 30, 0.8);
      --clr-border:   rgba(245, 158, 11, 0.15);
      --clr-border-h: rgba(245, 158, 11, 0.4);
      --clr-primary:  #f59e0b;
      --clr-accent:   #fbbf24;
      --clr-cyan:     #14b8a6;
      --clr-glow:     rgba(245, 158, 11, 0.45);
      --clr-text:     #f1f5f9;
      --clr-muted:    #a1a1aa;
      --radius-card:  28px;
      --radius-input: 14px;
      --transition:   0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html { height: 100%; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--clr-bg);
      color: var(--clr-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 1.5rem;
      position: relative;
    }

    /* Canvas Particle Background */
    #canvas-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Radial Glow Blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      pointer-events: none;
      z-index: 0;
      animation: blobFloat 8s ease-in-out infinite alternate;
    }
    .blob-1 { width: 560px; height: 560px; background: rgba(245, 158, 11, 0.18); top: -120px; left: -140px; animation-delay: 0s; }
    .blob-2 { width: 420px; height: 420px; background: rgba(20, 184, 166, 0.1); bottom: -80px; right: -100px; animation-delay: 3s; }
    .blob-3 { width: 320px; height: 320px; background: rgba(251, 113, 133, 0.1); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 1.5s; }

    @keyframes blobFloat {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 20px) scale(1.07); }
    }
    .blob-3 { animation: blobFloat3 9s ease-in-out infinite alternate; }
    @keyframes blobFloat3 {
      0%   { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(-50%, -50%) scale(1.1); }
    }

    /* Grid Overlay */
    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(245,158,11,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245,158,11,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 40%, transparent 100%);
    }

    /* Back Button */
    .back-btn {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--clr-muted);
      background: rgba(15, 20, 35, 0.6);
      border: 1px solid rgba(245, 158, 11, 0.12);
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      text-decoration: none;
      backdrop-filter: blur(12px);
      transition: var(--transition);
      cursor: pointer;
    }
    .back-btn:hover {
      color: #fff;
      border-color: var(--clr-border-h);
      box-shadow: 0 0 18px rgba(245,158,11,0.2);
      background: rgba(30, 28, 20, 0.7);
    }
    .back-btn svg { width: 14px; height: 14px; }

    /* Card */
    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-card);
      padding: 2.5rem 2.25rem 2rem;
      backdrop-filter: blur(28px) saturate(160%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 32px 80px rgba(0,0,0,0.55),
        0 0 60px rgba(245,158,11,0.06);
      animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Animated top border glow */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--clr-primary), var(--clr-cyan), var(--clr-primary), transparent);
      background-size: 200% 100%;
      filter: blur(2px);
      opacity: 0.7;
      animation: shimmer 4s linear infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Branding */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.75rem;
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: linear-gradient(135deg, #b45309, #d97706, #f59e0b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 1rem;
      position: relative;
      box-shadow: 0 0 30px rgba(245,158,11,0.45), 0 8px 24px rgba(0,0,0,0.4);
      animation: logoPulse 3s ease-in-out infinite;
    }
    .logo::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 21px;
      background: linear-gradient(135deg, #f59e0b, #14b8a6, #fb7185);
      z-index: -1;
      opacity: 0.5;
      filter: blur(6px);
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 25px rgba(245,158,11,0.45), 0 8px 24px rgba(0,0,0,0.4); }
      50%       { box-shadow: 0 0 45px rgba(245,158,11,0.65), 0 8px 24px rgba(0,0,0,0.4); }
    }

    .brand h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .brand h1 span {
      background: linear-gradient(90deg, #fbbf24, #14b8a6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand p {
      font-size: 0.75rem;
      color: var(--clr-muted);
      margin-top: 0.3rem;
      letter-spacing: 0.5px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: rgba(15, 20, 35, 0.6);
      border: 1px solid rgba(245, 158, 11, 0.1);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 1.5rem;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 0.55rem;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--clr-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      letter-spacing: 0.2px;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #b45309, #d97706);
      color: #fff;
      box-shadow: 0 0 18px rgba(245,158,11,0.35), 0 2px 8px rgba(0,0,0,0.3);
    }
    .tab-btn:not(.active):hover {
      color: #fff;
      background: rgba(245,158,11,0.08);
    }

    /* Alert */
    #alertMsg {
      display: none;
      font-size: 0.77rem;
      font-weight: 500;
      text-align: center;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      border: 1px solid transparent;
      animation: alertIn 0.3s ease;
    }
    #alertMsg.show { display: block; }
    @keyframes alertIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #alertMsg.success { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); color: #34d399; }
    #alertMsg.error   { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #f87171; }

    /* Form Header */
    .form-header {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--clr-muted);
      text-align: center;
      margin-bottom: 1.25rem;
    }

    /* Input Group */
    .input-group { margin-bottom: 1rem; }

    .input-group label {
      display: block;
      font-size: 0.73rem;
      font-weight: 500;
      color: var(--clr-muted);
      margin-bottom: 0.45rem;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .input-wrap { position: relative; }

    .input-wrap svg.input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: #57534e;
      pointer-events: none;
      transition: var(--transition);
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 0.8rem 1rem 0.8rem 2.75rem;
      background: rgba(15, 20, 35, 0.7);
      border: 1px solid rgba(245, 158, 11, 0.12);
      border-radius: var(--radius-input);
      color: var(--clr-text);
      font-family: 'Inter', sans-serif;
      font-size: 0.87rem;
      outline: none;
      transition: var(--transition);
      appearance: none;
    }
    .input-group input::placeholder { color: #57534e; }

    .input-group input:focus,
    .input-group select:focus {
      border-color: var(--clr-primary);
      background: rgba(20, 22, 30, 0.8);
      box-shadow: 0 0 0 3px rgba(245,158,11,0.12), 0 0 20px rgba(245,158,11,0.08);
    }
    .input-group:focus-within svg.input-icon { color: var(--clr-accent); }

    .input-group select { padding-left: 2.75rem; cursor: pointer; }
    .input-group select option { background: #0f172a; color: var(--clr-text); }

    /* Password toggle */
    .toggle-pass {
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #57534e;
      transition: color var(--transition);
      display: flex;
      align-items: center;
      padding: 4px;
    }
    .toggle-pass:hover { color: var(--clr-accent); }
    .toggle-pass svg { width: 16px; height: 16px; }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.85rem 1rem;
      background: linear-gradient(135deg, #b45309 0%, #d97706 50%, #f59e0b 100%);
      background-size: 200% 100%;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
      transition: background-position 0.4s ease, box-shadow var(--transition), transform var(--transition);
      box-shadow: 0 4px 24px rgba(245,158,11,0.35), 0 0 0 1px rgba(255,255,255,0.08) inset;
    }
    .btn-submit::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
      transition: left 0.5s ease;
    }
    .btn-submit:hover::before { left: 100%; }
    .btn-submit:hover {
      background-position: 100% 0;
      box-shadow: 0 6px 32px rgba(245,158,11,0.55), 0 0 0 1px rgba(255,255,255,0.1) inset;
      transform: translateY(-1px);
    }
    .btn-submit:active { transform: translateY(0); }

    /* Switch Link */
    .switch-link {
      text-align: center;
      font-size: 0.78rem;
      color: var(--clr-muted);
      margin-top: 1.1rem;
    }
    .switch-link button {
      background: none;
      border: none;
      color: var(--clr-accent);
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
      transition: color var(--transition);
      font-family: 'Inter', sans-serif;
    }
    .switch-link button:hover { color: var(--clr-cyan); text-decoration: underline; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.1rem 0 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(245,158,11,0.15), transparent);
    }
    .divider span { font-size: 0.7rem; color: #57534e; white-space: nowrap; }

    /* Stats Strip */
    .stats-strip {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(245,158,11,0.06);
    }
    .stat { text-align: center; }
    .stat-val {
      display: block;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      background: linear-gradient(90deg, #fbbf24, #14b8a6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-lbl { font-size: 0.67rem; color: #57534e; letter-spacing: 0.4px; }

    /* Form Transition */
    form { display: none; }
    form.active {
      display: block;
      animation: formIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes formIn {
      from { opacity: 0; transform: translateX(12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* Secure badge */
    .secure-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.68rem;
      color: #57534e;
      background: rgba(15,20,35,0.6);
      border: 1px solid rgba(245,158,11,0.08);
      border-radius: 999px;
      padding: 0.3rem 0.75rem;
      margin: 0.9rem auto 0;
      width: fit-content;
    }
    .secure-badge svg { width: 10px; height: 10px; color: #34d399; }
  </style>
</head>
<body>

  <canvas id="canvas-bg"></canvas>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="grid-overlay"></div>

  <a href="home.html" class="back-btn" id="backToHome">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Back to Home
  </a>

  <div class="card">

    <div class="brand">
      <div class="logo">CB</div>
      <h1>Campus<span>Bridge</span></h1>
      <p>Bridging Every Campus Connection</p>
    </div>

    <div id="alertMsg"></div>

    <div class="tabs">
      <button class="tab-btn active" id="tabLogin" type="button">Sign In</button>
      <button class="tab-btn" id="tabRegister" type="button">Create Account</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="active">
      <div class="form-header">Welcome back 👋 Let's get you in</div>

      <div class="input-group">
        <label for="loginEmail">Email Address</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <input type="email" id="loginEmail" placeholder="you@university.edu" required autocomplete="email"/>
        </div>
      </div>

      <div class="input-group">
        <label for="loginPassword">Password</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="loginPassword" placeholder="••••••••••" required autocomplete="current-password"/>
          <button type="button" class="toggle-pass" id="toggleLoginPass" aria-label="Toggle password visibility">
            <svg id="loginEyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="loginSubmit">
        Sign In to CampusBridge &rarr;
      </button>

      <div class="switch-link">
        New here?&nbsp;
        <button type="button" id="showRegisterBtn">Create your account</button>
      </div>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm">
      <div class="form-header">Join the campus network 🎓</div>

      <div class="input-group">
        <label for="regFullName">Full Name</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="regFullName" placeholder="Your full name" required autocomplete="name"/>
        </div>
      </div>

      <div class="input-group">
        <label for="regRole">Your Role</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
          <select id="regRole">
            <option value="Student">Student 🎓</option>
            <option value="Professor">Professor 🧑‍🏫</option>
            <option value="Alumni">Alumni 💼</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label for="regEmail">Email Address</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <input type="email" id="regEmail" placeholder="you@university.edu" required autocomplete="email"/>
        </div>
      </div>

      <div class="input-group">
        <label for="regPassword">Password</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="regPassword" placeholder="Create a strong password" required autocomplete="new-password"/>
          <button type="button" class="toggle-pass" id="toggleRegPass" aria-label="Toggle password visibility">
            <svg id="regEyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="registerSubmit">
        Create My Account &rarr;
      </button>

      <div class="switch-link">
        Already a member?&nbsp;
        <button type="button" id="showLoginBtn">Sign in instead</button>
      </div>
    </form>

    <div class="divider"><span>TRUSTED NETWORK</span></div>
    <div class="stats-strip">
      <div class="stat"><span class="stat-val">12K+</span><span class="stat-lbl">Students</span></div>
      <div class="stat"><span class="stat-val">800+</span><span class="stat-lbl">Professors</span></div>
      <div class="stat"><span class="stat-val">5K+</span><span class="stat-lbl">Alumni</span></div>
    </div>

    <div style="display:flex;justify-content:center;">
      <div class="secure-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        256-bit encrypted &middot; Secure login
      </div>
    </div>

  </div>

  <script src="js/script.js"></script>
  <script>
    /* Particle Canvas */
    (function() {
      const canvas = document.getElementById('canvas-bg');
      const ctx = canvas.getContext('2d');
      let W, H, particles = [], mouse = { x: -999, y: -999 };
      const N = 80;
      const COLORS = ['rgba(245,158,11,', 'rgba(20,184,166,', 'rgba(251,113,133,', 'rgba(251,191,36,'];

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }

      function randomParticle() {
        return {
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.8 + 0.4,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          alpha: Math.random() * 0.5 + 0.1,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          pulse: Math.random() * Math.PI * 2,
        };
      }

      function init() { resize(); particles = Array.from({ length: N }, randomParticle); }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 130) {
              ctx.beginPath();
              ctx.strokeStyle = 'rgba(245,158,11,' + (0.07 * (1 - dist / 130)) + ')';
              ctx.lineWidth = 0.5;
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
        }

        particles.forEach(p => {
          p.pulse += 0.02;
          const pa = p.alpha + Math.sin(p.pulse) * 0.1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color + Math.min(1, Math.max(0, pa)) + ')';
          ctx.fill();

          p.x += p.vx;
          p.y += p.vy;

          const mdx = p.x - mouse.x;
          const mdy = p.y - mouse.y;
          const md = Math.sqrt(mdx * mdx + mdy * mdy);
          if (md < 100) { p.x += (mdx / md) * 0.7; p.y += (mdy / md) * 0.7; }

          if (p.x < -10) p.x = W + 10;
          if (p.x > W + 10) p.x = -10;
          if (p.y < -10) p.y = H + 10;
          if (p.y > H + 10) p.y = -10;
        });

        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
      init(); draw();
    })();

    /* Tab Switching */
    const tabLogin    = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginForm   = document.getElementById('loginForm');
    const regForm     = document.getElementById('registerForm');
    const alertMsg    = document.getElementById('alertMsg');

    function switchTab(view) {
      alertMsg.className = '';
      alertMsg.style.display = 'none';
      if (view === 'login') {
        tabLogin.classList.add('active'); tabRegister.classList.remove('active');
        loginForm.classList.add('active'); regForm.classList.remove('active');
      } else {
        tabRegister.classList.add('active'); tabLogin.classList.remove('active');
        regForm.classList.add('active'); loginForm.classList.remove('active');
      }
    }

    tabLogin.addEventListener('click',    () => switchTab('login'));
    tabRegister.addEventListener('click', () => switchTab('register'));
    document.getElementById('showRegisterBtn').addEventListener('click', () => switchTab('register'));
    document.getElementById('showLoginBtn').addEventListener('click',    () => switchTab('login'));

    /* Password Eye Icons */
    const eyeOpen = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    const eyeOff  = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';

    function setupToggle(btnId, inputId, iconId) {
      const btn = document.getElementById(btnId);
      const icon = document.getElementById(iconId);
      if (!btn) return;
      btn.addEventListener('click', () => {
        const inp = document.getElementById(inputId);
        const isPass = inp.type === 'password';
        inp.type = isPass ? 'text' : 'password';
        icon.innerHTML = isPass ? eyeOff : eyeOpen;
      });
    }
    setupToggle('toggleLoginPass', 'loginPassword', 'loginEyeIcon');
    setupToggle('toggleRegPass',   'regPassword',   'regEyeIcon');
  </script>
</body>
</html>
