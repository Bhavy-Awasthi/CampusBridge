<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Group Chat — CampusBridge</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0e1a;--surface:rgba(12,17,30,0.8);--border:rgba(245,158,11,0.12);--text:#f1f5f9;--muted:#a1a1aa;--dim:#57534e}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(245,158,11,0.3);border-radius:3px}

    .chat-layout{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - 64px);max-width:1200px;margin:0 auto;width:100%;padding:1rem;gap:1rem}

    /* Sidebar */
    .chat-sidebar{background:var(--surface);border:1px solid var(--border);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
    .sidebar-header{padding:1rem 1rem 0.75rem;border-bottom:1px solid rgba(245,158,11,0.08)}
    .sidebar-header h2{font-family:'Space Grotesk',sans-serif;font-size:0.95rem;font-weight:700;color:var(--text)}
    .rooms-list{flex:1;overflow-y:auto;padding:0.5rem}
    .room-btn{display:flex;align-items:center;gap:0.6rem;width:100%;padding:0.65rem 0.75rem;border-radius:10px;border:none;background:transparent;color:var(--muted);font-family:'Inter',sans-serif;font-size:0.85rem;cursor:pointer;transition:all 0.2s;text-align:left}
    .room-btn:hover,.room-btn.active{background:radial-gradient(circle, rgba(245,158,11,0.12) 0%, transparent 70%);color:var(--text)}
    .room-icon{width:30px;height:30px;border-radius:8px;background:radial-gradient(circle, rgba(245,158,11,0.15) 0%, transparent 70%);display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0}

    /* Main */
    .chat-main{background:var(--surface);border:1px solid var(--border);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
    .chat-header{padding:1rem 1.25rem;border-bottom:1px solid rgba(245,158,11,0.08);display:flex;align-items:center;gap:0.75rem}
    .chat-room-name{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;color:var(--text)}
    .online-indicator{display:flex;align-items:center;gap:0.35rem;font-size:0.72rem;color:#34d399}
    .online-dot{width:6px;height:6px;border-radius:50%;background:#34d399;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

    .messages-wrap{flex:1;overflow-y:auto;padding:1rem 1.25rem;display:flex;flex-direction:column;gap:0.5rem}
    .day-separator{text-align:center;font-size:0.72rem;color:var(--dim);margin:0.5rem 0;position:relative}
    .day-separator::before,.day-separator::after{content:'';position:absolute;top:50%;width:30%;height:1px;background:radial-gradient(circle, rgba(245,158,11,0.12) 0%, transparent 70%)}
    .day-separator::before{left:0}.day-separator::after{right:0}

    .msg-group{display:flex;gap:0.65rem;align-items:flex-end}
    .msg-group.mine{flex-direction:row-reverse}
    .msg-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid rgba(245,158,11,0.18)}
    .msg-group-content{display:flex;flex-direction:column;gap:0.15rem;max-width:70%}
    .msg-sender-name{font-size:0.72rem;font-weight:600;color:var(--muted);margin-bottom:0.1rem}
    .msg-group.mine .msg-sender-name{text-align:right}
    .bubble{padding:0.55rem 0.9rem;border-radius:18px;font-size:0.86rem;line-height:1.5;word-break:break-word}
    .bubble.theirs{background:var(--surface);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:4px}
    .bubble.mine{background:linear-gradient(135deg,#d97706,#f59e0b);color:#fff;border-bottom-right-radius:4px}
    .msg-time-row{display:flex;font-size:0.65rem;color:var(--dim)}
    .msg-group.mine .msg-time-row{justify-content:flex-end}

    .chat-input-bar{padding:1rem 1.25rem;border-top:1px solid rgba(245,158,11,0.08);display:flex;gap:0.75rem;align-items:flex-end}
    .chat-textarea{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:0.7rem 1rem;color:var(--text);font-family:'Inter',sans-serif;font-size:0.87rem;resize:none;outline:none;max-height:120px;min-height:44px;transition:border-color 0.2s;line-height:1.5}
    .chat-textarea:focus{border-color:#f59e0b}
    .chat-textarea::placeholder{color:var(--dim)}
    .send-btn{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#d97706,#f59e0b);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;box-shadow:0 4px 12px rgba(245,158,11,0.3)}
    .send-btn:hover{transform:scale(1.05);box-shadow:0 6px 20px rgba(245,158,11,0.5)}
  </style>
</head>
<body>
<script src="js/auth.js"></script>
<script>renderNav('chat');</script>

<div class="chat-layout">
  <!-- Sidebar -->
  <div class="chat-sidebar">
    <div class="sidebar-header"><h2>💬 Rooms</h2></div>
    <div class="rooms-list" id="rooms-list">
      <!-- Static rooms + course rooms added dynamically -->
    </div>
  </div>

  <!-- Main Chat -->
  <div class="chat-main">
    <div class="chat-header">
      <div>
        <div class="chat-room-name" id="room-name">Select a room</div>
        <div class="online-indicator"><div class="online-dot"></div>Live · updates every 2s</div>
      </div>
    </div>
    <div class="messages-wrap" id="messages-wrap">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--dim);gap:0.5rem">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <p>Select a room to start chatting</p>
      </div>
    </div>
    <div class="chat-input-bar">
      <textarea class="chat-textarea" id="chat-input" placeholder="Type a message... (Enter to send)" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
      <button class="send-btn" onclick="sendMessage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const myUser = getUser();
let currentRoom = null;
let pollTimer = null;
let lastMessageId = null;

const staticRooms = [
  { id: 'general', name: 'General', icon: '🌐' },
  { id: 'announcements', name: 'Announcements', icon: '📢' },
  { id: 'study-help', name: 'Study Help', icon: '📖' },
  { id: 'campus-life', name: 'Campus Life', icon: '🎓' },
  { id: 'career', name: 'Career & Placements', icon: '💼' },
];

async function buildRooms() {
  const el = document.getElementById('rooms-list');
  let rooms = [...staticRooms];
  try {
    const res = await apiFetch('/courses');
    const courses = await res.json();
    courses.slice(0, 5).forEach(c => rooms.push({ id: 'course-' + c._id, name: c.title, icon: '📚' }));
  } catch {}
  el.innerHTML = rooms.map(r => `
    <button class="room-btn" id="room-btn-${r.id}" onclick="joinRoom('${r.id}','${r.name}')">
      <div class="room-icon">${r.icon}</div>
      ${r.name}
    </button>`).join('');
  // Auto-join general
  joinRoom('general', 'General');
}

async function joinRoom(roomId, roomName) {
  clearInterval(pollTimer);
  currentRoom = roomId;
  lastMessageId = null;
  document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`room-btn-${roomId}`)?.classList.add('active');
  document.getElementById('room-name').textContent = roomName;
  document.getElementById('messages-wrap').innerHTML = '<div style="text-align:center;padding:2rem"><span class="spinner"></span></div>';
  await loadMessages(true);
  pollTimer = setInterval(() => loadMessages(false), 2000);
}

async function loadMessages(scroll = true) {
  if (!currentRoom) return;
  try {
    const res = await apiFetch(`/messages/${currentRoom}`);
    const messages = await res.json();
    const wrap = document.getElementById('messages-wrap');
    if (!wrap) return;
    const wasAtBottom = wrap.scrollTop + wrap.clientHeight >= wrap.scrollHeight - 40;
    if (!messages.length) {
      wrap.innerHTML = '<div style="text-align:center;color:var(--dim);padding:2rem;font-size:0.85rem">No messages yet. Say hello! 👋</div>';
      return;
    }
    wrap.innerHTML = buildMessageHTML(messages);
    if (scroll || wasAtBottom) wrap.scrollTop = wrap.scrollHeight;
  } catch {}
}

function buildMessageHTML(messages) {
  let html = '';
  let prevSender = null;
  for (let i = 0; i < messages.length; i++) {
    const m = messages[i];
    const mine = m.sender?._id === myUser?.id || m.sender?._id === myUser?._id;
    const showAvatar = prevSender !== m.sender?._id;
    prevSender = m.sender?._id;
    html += `<div class="msg-group ${mine?'mine':''}">
      ${!mine ? `<a href="profile.html?id=${m.sender?._id}">${showAvatar?`<img src="${avatarUrl(m.sender?.avatar)}" class="msg-avatar"/>` : '<div style="width:28px"></div>'}</a>` : ''}
      <div class="msg-group-content">
        ${showAvatar && !mine ? `<div class="msg-sender-name"><a href="profile.html?id=${m.sender?._id}" style="color:inherit;text-decoration:none">${m.sender?.fullName}</a> ${roleBadge(m.sender?.role)}</div>` : ''}
        <div class="bubble ${mine?'mine':'theirs'}">${m.text}</div>
        ${i === messages.length-1 || messages[i+1]?.sender?._id !== m.sender?._id ? `<div class="msg-time-row">${timeAgo(m.createdAt)}</div>` : ''}
      </div>
      ${mine ? `<a href="profile.html?id=${m.sender?._id}">${showAvatar?`<img src="${avatarUrl(m.sender?.avatar)}" class="msg-avatar"/>` : '<div style="width:28px"></div>'}</a>` : ''}
    </div>`;
  }
  return html;
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !currentRoom) return;
  input.value = '';
  try {
    await apiFetch(`/messages/${currentRoom}`, { method: 'POST', body: JSON.stringify({ text }) });
    await loadMessages(true);
  } catch {}
}

buildRooms();
</script>
</body>
</html>
